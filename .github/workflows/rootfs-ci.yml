name: Validate rootfs scripts

on:
  push:
    branches: [main, v1beta]
    paths:
      - .github/actions/build-rootfs/action.yml
      - .github/workflows/rootfs-ci.yml
      - .github/workflows/rootfs-release.yml
      - tcpquality-tcpinfo.c
      - tcpquality-retrans-seq.bt
      - tcpquality-retrans-skb.bt
      - runTcpQuality-rootfs.sh
      - runTcpQuality-core.sh
      - runTcpQuality.sh
      - tests/low-memory/**
      - tests/report-upload/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rootfs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Validate shell scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n runTcpQuality.sh runTcpQuality-rootfs.sh runTcpQuality-core.sh
      - name: Test memory policy and partial results
        run: |
          timeout 30 bash tests/low-memory/memory-policy.sh
          timeout 30 bash tests/low-memory/results-preservation.sh
      - name: Test report upload diagnostics
        run: timeout 30 bash tests/report-upload/diagnostics.sh
      - name: Test Debian and Alpine with 128 MiB and no swap
        run: bash tests/low-memory/run.sh
