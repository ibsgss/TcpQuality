name: Build rootfs release

on:
  push:
    branches: [main, v1beta]
    paths:
      - .github/actions/build-rootfs/action.yml
      - .github/workflows/rootfs-release.yml
      - runTcpQuality-core.sh
      - runTcpQuality-beta.sh
      - runTcpQuality-rootfs.sh
      - runTcpQuality.sh
      - tcpquality-tcpinfo.c
      - tcpquality-retrans-seq.bt
      - tcpquality-retrans-skb.bt
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag, for example v1.00001
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rootfs-release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select release channel
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      alias_tag: ${{ steps.release.outputs.alias_tag }}
    steps:
      - name: Select immutable release tag and channel alias
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail

          case "$GITHUB_REF_NAME" in
            main)
              alias_tag=v1.latest
              ;;
            v1beta)
              alias_tag=v1beta.latest
              ;;
            *)
              echo "rootfs release is only allowed from main or v1beta" >&2
              exit 1
              ;;
          esac

          if [ -n "$INPUT_RELEASE_TAG" ]; then
            release_tag="$INPUT_RELEASE_TAG"
          else
            latest_number=$(gh release list --repo "$GH_REPO" --limit 1000 --json tagName --jq '.[].tagName' \
              | sed -nE 's/^v1\.([0-9]{5})$/\1/p' \
              | sort -n \
              | tail -1)
            latest_number=${latest_number:-0}
            next_number=$((10#$latest_number + 1))
            [ "$next_number" -le 99999 ] || {
              echo "no v1 release tag remains" >&2
              exit 1
            }
            printf -v release_tag 'v1.%05d' "$next_number"
          fi

          [[ "$release_tag" =~ ^v1\.[0-9]{5}$ ]] || {
            echo "release_tag must match v1.00001, v1.00002, ..." >&2
            exit 1
          }
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'alias_tag=%s\n' "$alias_tag" >> "$GITHUB_OUTPUT"
          printf 'Publishing %s from %s as %s\n' "$release_tag" "$GITHUB_REF_NAME" "$alias_tag"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and validate rootfs
        uses: ./.github/actions/build-rootfs
        with:
          arch: ${{ matrix.arch }}
          release-marker: ${{ needs.prepare.outputs.release_tag }}

      - name: Upload architecture artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: |
            dist/tcpquality-rootfs-${{ matrix.arch }}.tar.gz
            dist/tcpquality-rootfs-${{ matrix.arch }}.tar.gz.sha256
            dist/tcpquality-rootfs-${{ matrix.arch }}.tar.xz
            dist/tcpquality-rootfs-${{ matrix.arch }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      ALIAS_TAG: ${{ needs.prepare.outputs.alias_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download rootfs artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rootfs-*
          path: dist
          merge-multiple: true

      - name: Generate manifest
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v1\.[0-9]{5}$ ]]; then
            echo "release_tag must match v1.00001, v1.00002, ..." >&2
            exit 1
          fi
          for arch in amd64 arm64; do
            for format in gz xz; do
              file="dist/tcpquality-rootfs-${arch}.tar.${format}"
              test -s "$file"
              sha256sum "$file"
            done
          done
          amd64_xz_file=tcpquality-rootfs-amd64.tar.xz
          amd64_gz_file=tcpquality-rootfs-amd64.tar.gz
          arm64_xz_file=tcpquality-rootfs-arm64.tar.xz
          arm64_gz_file=tcpquality-rootfs-arm64.tar.gz
          amd64_xz_sha=$(sha256sum "dist/$amd64_xz_file" | awk '{print $1}')
          amd64_gz_sha=$(sha256sum "dist/$amd64_gz_file" | awk '{print $1}')
          arm64_xz_sha=$(sha256sum "dist/$arm64_xz_file" | awk '{print $1}')
          arm64_gz_sha=$(sha256sum "dist/$arm64_gz_file" | awk '{print $1}')
          amd64_xz_size=$(stat -c '%s' "dist/$amd64_xz_file")
          amd64_gz_size=$(stat -c '%s' "dist/$amd64_gz_file")
          arm64_xz_size=$(stat -c '%s' "dist/$arm64_xz_file")
          arm64_gz_size=$(stat -c '%s' "dist/$arm64_gz_file")
          jq -n \
            --arg version "$RELEASE_TAG" \
            --arg amd64_file "$amd64_xz_file" \
            --arg amd64_sha "$amd64_xz_sha" \
            --argjson amd64_size "$amd64_xz_size" \
            --arg amd64_fallback_file "$amd64_gz_file" \
            --arg amd64_fallback_sha "$amd64_gz_sha" \
            --argjson amd64_fallback_size "$amd64_gz_size" \
            --arg arm64_file "$arm64_xz_file" \
            --arg arm64_sha "$arm64_xz_sha" \
            --argjson arm64_size "$arm64_xz_size" \
            --arg arm64_fallback_file "$arm64_gz_file" \
            --arg arm64_fallback_sha "$arm64_gz_sha" \
            --argjson arm64_fallback_size "$arm64_gz_size" \
            '{
              version: $version,
              architectures: {
                amd64: {
                  file: $amd64_file,
                  sha256: $amd64_sha,
                  size: $amd64_size,
                  fallbackFile: $amd64_fallback_file,
                  fallbackSha256: $amd64_fallback_sha,
                  fallbackSize: $amd64_fallback_size
                },
                arm64: {
                  file: $arm64_file,
                  sha256: $arm64_sha,
                  size: $arm64_size,
                  fallbackFile: $arm64_fallback_file,
                  fallbackSha256: $arm64_fallback_sha,
                  fallbackSize: $arm64_fallback_size
                }
              }
            }' > dist/rootfs-manifest.json
          cat dist/rootfs-manifest.json

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; use a new immutable tag." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/rootfs-manifest.json \
            dist/tcpquality-rootfs-amd64.tar.gz \
            dist/tcpquality-rootfs-amd64.tar.xz \
            dist/tcpquality-rootfs-arm64.tar.gz \
            dist/tcpquality-rootfs-arm64.tar.xz \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes "Prebuilt Debian bookworm-slim rootfs for TcpQuality. Downloads are verified using the attached manifest."

      - name: Update channel alias
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          git tag -f "$ALIAS_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$ALIAS_TAG"
          if gh release view "$ALIAS_TAG" >/dev/null 2>&1; then
            gh release upload "$ALIAS_TAG" --clobber \
              dist/tcpquality-rootfs-amd64.tar.gz \
              dist/tcpquality-rootfs-arm64.tar.gz \
              dist/tcpquality-rootfs-amd64.tar.xz \
              dist/tcpquality-rootfs-arm64.tar.xz
            gh release upload "$ALIAS_TAG" --clobber dist/rootfs-manifest.json
            gh release edit "$ALIAS_TAG" \
              --title "$ALIAS_TAG" \
              --notes "Stable alias for $RELEASE_TAG from $GITHUB_REF_NAME. Verify downloads with the attached manifest."
          else
            gh release create "$ALIAS_TAG" \
              dist/tcpquality-rootfs-amd64.tar.gz \
              dist/tcpquality-rootfs-amd64.tar.xz \
              dist/tcpquality-rootfs-arm64.tar.gz \
              dist/tcpquality-rootfs-arm64.tar.xz \
              dist/rootfs-manifest.json \
              --title "$ALIAS_TAG" \
              --notes "Stable alias for $RELEASE_TAG from $GITHUB_REF_NAME. Verify downloads with the attached manifest."
          fi
